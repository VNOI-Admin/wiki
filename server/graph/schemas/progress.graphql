# ===============================================
# PROGRESS TRACKING
# ===============================================

extend type Query {
  progress: ProgressQuery
}

extend type Mutation {
  progress: ProgressMutation
}

# -----------------------------------------------
# QUERIES
# -----------------------------------------------

type ProgressQuery {
  config: ProgressConfig @auth(requires: ["manage:system"])

  # JSON-encoded record list of the logged-in reader; null for guests
  mine: String
}

# -----------------------------------------------
# MUTATIONS
# -----------------------------------------------

type ProgressMutation {
  setConfig(
    isEnabled: Boolean!
    showLinkMarkers: Boolean!
    statuses: [ProgressStatusInput]!
  ): DefaultResponse @auth(requires: ["manage:system"])

  # records: JSON-encoded record list. merge=true merges newer-wins into the stored
  # list (used once after login); otherwise the stored list is replaced.
  save(
    records: String!
    merge: Boolean
  ): ProgressSaveResponse
}

# -----------------------------------------------
# TYPES
# -----------------------------------------------

type ProgressSaveResponse {
  responseResult: ResponseStatus!
  # JSON-encoded record list now stored
  records: String
}

type ProgressConfig {
  isEnabled: Boolean!
  showLinkMarkers: Boolean!
  statuses: [ProgressStatus]!
}

type ProgressStatus {
  id: String!
  label: String!
  icon: String!
  color: String!
  isDefault: Boolean!
  showMarker: Boolean!
}

input ProgressStatusInput {
  id: String!
  label: String!
  icon: String!
  color: String!
  isDefault: Boolean!
  showMarker: Boolean!
}
